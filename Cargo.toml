[package]
name = "djqlint"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "DjQlint — a fast static analyzer that detects inefficient Django ORM queries and database anti-patterns in Python code."
license = "MIT"
repository = "https://github.com/ak4code/djqlint"
keywords = ["django", "orm", "linter", "static-analysis", "sast"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "djqlint"
path = "src/main.rs"

[dependencies]
# AST parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"
streaming-iterator = "0.1"

# Parallelism & filesystem traversal (respects .gitignore)
rayon = "1.10"
ignore = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Diagnostics / pretty terminal output
miette = { version = "7.2", features = ["fancy"] }
thiserror = "1.0"
anyhow = "1.0"

# Config & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
regex = "1.10"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[dev-dependencies]
tempfile = "3.10"
